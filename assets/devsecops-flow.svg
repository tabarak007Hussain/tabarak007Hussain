<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060914" />
      <stop offset="50%" stop-color="#0A1128" />
      <stop offset="100%" stop-color="#050812" />
    </linearGradient>

    <!-- Glowing Path Gradients -->
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
    .stage-title { font-size: 13.5px; font-weight: 700; fill: #FFFFFF; }
    .stage-desc { font-size: 11px; fill: #94A3B8; }
  </style>

  <!-- Base Plate -->
  <rect width="1200" height="300" rx="16" fill="url(#flowBg)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Top Title -->
  <g transform="translate(48, 36)">
    <circle cx="6" cy="6" r="4" fill="#00F2FE">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="20" y="10" class="mono" font-size="12" fill="#38BDF8" font-weight="700" letter-spacing="1.5">
      END-TO-END ZERO-TRUST DEVSECOPS &amp; CLOUD ARCHITECTURE LIFECYCLE
    </text>
  </g>

  <!-- Connecting Stream Line -->
  <path d="M 120 160 L 1080 160" stroke="#1E293B" stroke-width="4" stroke-linecap="round" />
  <path d="M 120 160 L 1080 160" stroke="url(#streamGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="80 120">
    <animate attributeName="stroke-dashoffset" from="0" to="-400" dur="5s" repeatCount="indefinite" />
  </path>

  <!-- ================= STAGE 1: AUTHORING & IAC ================= -->
  <g transform="translate(60, 80)">
    <rect width="195" height="160" rx="12" fill="#0C152B" stroke="#0284C7" stroke-width="1.2" />
    <circle cx="97.5" cy="80" r="14" fill="#0E2145" stroke="#38BDF8" stroke-width="2" />
    <text x="97.5" y="85" class="mono" font-size="13" font-weight="800" fill="#38BDF8" text-anchor="middle">01</text>
    
    <text x="97.5" y="32" class="sans stage-title" text-anchor="middle">IaC Architecture</text>
    <text x="97.5" y="50" class="mono stage-desc" text-anchor="middle">Terraform &amp; Azure Modules</text>

    <g transform="translate(16, 110)">
      <text x="0" y="12" class="mono" font-size="10" fill="#CBD5E1">▸ Reusable VNet &amp; AKS</text>
      <text x="0" y="28" class="mono" font-size="10" fill="#CBD5E1">▸ Remote Blob Locking</text>
      <text x="0" y="44" class="mono" font-size="10" fill="#38BDF8">▸ Modular Standards</text>
    </g>
  </g>

  <!-- ================= STAGE 2: SHIFT-LEFT SECURITY ================= -->
  <g transform="translate(285, 80)">
    <rect width="195" height="160" rx="12" fill="#0C152B" stroke="#EF4444" stroke-width="1.2" />
    <circle cx="97.5" cy="80" r="14" fill="#2A0F1D" stroke="#F43F5E" stroke-width="2" />
    <text x="97.5" y="85" class="mono" font-size="13" font-weight="800" fill="#F43F5E" text-anchor="middle">02</text>
    
    <text x="97.5" y="32" class="sans stage-title" text-anchor="middle">Shift-Left Security</text>
    <text x="97.5" y="50" class="mono stage-desc" text-anchor="middle">PR Static Scanners</text>

    <g transform="translate(16, 110)">
      <text x="0" y="12" class="mono" font-size="10" fill="#CBD5E1">▸ TruffleHog Secrets</text>
      <text x="0" y="28" class="mono" font-size="10" fill="#CBD5E1">▸ tfsec &amp; Checkov CIS</text>
      <text x="0" y="44" class="mono" font-size="10" fill="#F43F5E">▸ 100% Policy Block</text>
    </g>
  </g>

  <!-- ================= STAGE 3: FINOPS & TERRATEST ================= -->
  <g transform="translate(510, 80)">
    <rect width="195" height="160" rx="12" fill="#0C152B" stroke="#10B981" stroke-width="1.2" />
    <circle cx="97.5" cy="80" r="14" fill="#0A2A1E" stroke="#10B981" stroke-width="2" />
    <text x="97.5" y="85" class="mono" font-size="13" font-weight="800" fill="#10B981" text-anchor="middle">03</text>
    
    <text x="97.5" y="32" class="sans stage-title" text-anchor="middle">FinOps &amp; Testing</text>
    <text x="97.5" y="50" class="mono stage-desc" text-anchor="middle">Cost &amp; Integration</text>

    <g transform="translate(16, 110)">
      <text x="0" y="12" class="mono" font-size="10" fill="#CBD5E1">▸ Infracost PR Delta</text>
      <text x="0" y="28" class="mono" font-size="10" fill="#CBD5E1">▸ Terratest Go Suites</text>
      <text x="0" y="44" class="mono" font-size="10" fill="#34D399">▸ 40% Waste Slashed</text>
    </g>
  </g>

  <!-- ================= STAGE 4: CI/CD PIPELINES ================= -->
  <g transform="translate(735, 80)">
    <rect width="195" height="160" rx="12" fill="#0C152B" stroke="#6366F1" stroke-width="1.2" />
    <circle cx="97.5" cy="80" r="14" fill="#1A1845" stroke="#818CF8" stroke-width="2" />
    <text x="97.5" y="85" class="mono" font-size="13" font-weight="800" fill="#818CF8" text-anchor="middle">04</text>
    
    <text x="97.5" y="32" class="sans stage-title" text-anchor="middle">CI/CD Engine</text>
    <text x="97.5" y="50" class="mono stage-desc" text-anchor="middle">Zero-Downtime Delivery</text>

    <g transform="translate(16, 110)">
      <text x="0" y="12" class="mono" font-size="10" fill="#CBD5E1">▸ GitHub Actions &amp; ADO</text>
      <text x="0" y="28" class="mono" font-size="10" fill="#CBD5E1">▸ OIDC Keyless Auth</text>
      <text x="0" y="44" class="mono" font-size="10" fill="#A78BFA">▸ Canary Deployments</text>
    </g>
  </g>

  <!-- ================= STAGE 5: AZURE PLATFORM ================= -->
  <g transform="translate(960, 80)">
    <rect width="180" height="160" rx="12" fill="#0C152B" stroke="#00F2FE" stroke-width="1.2" />
    <circle cx="90" cy="80" r="14" fill="#0A283B" stroke="#00F2FE" stroke-width="2" />
    <text x="90" y="85" class="mono" font-size="13" font-weight="800" fill="#00F2FE" text-anchor="middle">05</text>
    
    <text x="90" y="32" class="sans stage-title" text-anchor="middle">Azure Platform</text>
    <text x="90" y="50" class="mono stage-desc" text-anchor="middle">Production Infrastructure</text>

    <g transform="translate(16, 110)">
      <text x="0" y="12" class="mono" font-size="10" fill="#CBD5E1">▸ Multi-AZ AKS Clusters</text>
      <text x="0" y="28" class="mono" font-size="10" fill="#CBD5E1">▸ Key Vault &amp; Entra ID</text>
      <text x="0" y="44" class="mono" font-size="10" fill="#00F2FE">▸ Prometheus/Grafana</text>
    </g>
  </g>
</svg>

